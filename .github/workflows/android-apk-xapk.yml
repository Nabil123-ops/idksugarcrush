name: Build Android APK & XAPK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build Web Assets & Sync Capacitor Android
        run: npm run cap:sync

      - name: Build Debug & Release APKs
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease

      - name: Package APK & XAPK Bundles
        run: node scripts/package-xapk.mjs

      - name: Upload APK & XAPK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SugarCrown-Android-Packages
          path: dist-android/*
          retention-days: 30
